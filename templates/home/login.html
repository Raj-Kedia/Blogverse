{% extends 'base.html' %}
{% block title %} Login - Blogverse {% endblock title %}

{% block body %}
<div class="container my-5" style="max-width: 500px;">
    <div class="card p-5 shadow">
        <div class="text-center mb-4">
            <img src="/static/img/logo.svg" alt="Blogverse Logo" width="60" class="mb-3">
            <h2 class="font-weight-bold">Login to Blogverse</h2>
            <p class="text-muted">Welcome back! Please enter your details.</p>
        </div>
        <form action="{% url 'handleLogin' %}" method="POST">
            {% csrf_token %}
            {% if request.GET.next %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">
            {% elif request.POST.next %}
                <input type="hidden" name="next" value="{{ request.POST.next }}">
            {% endif %}
            
            <div class="form-group mb-4">
                <label for="username" class="font-weight-bold">Username</label>
                <input type="text" class="form-control" id="loginusername" name="loginusername"
                    placeholder="Enter your username" required>
            </div>
            
            <div class="form-group mb-4">
                <label for="pass" class="font-weight-bold">Password</label>
                <input type="password" class="form-control" id="loginpassword" name="loginpassword"
                    placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block py-2 shadow-sm">Sign In</button>
        </form>
        <div class="text-center mt-4">
            <p class="text-muted small">Don't have an account? <a href="#" data-toggle="modal" data-target="#signupModal">Sign up here</a></p>
        </div>
    </div>
</div>
{% endblock %}
